name: Apply Source Fixes

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply verified Dart fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('lib/screens/home_screen.dart')
          s = home.read_text(encoding='utf-8')
          old = """    final updatedShipment = Pengiriman(\n      id: shipment.id,\n      pengirim: shipment.pengirim,\n      tanggal: shipment.tanggal,\n      nomorResi: shipment.nomorResi,\n      barang: updatedBarang,\n    );"""
          new = """    final updatedShipment = Pengiriman(\n      id: shipment.id,\n      pengirim: shipment.pengirim,\n      noTelepon: shipment.noTelepon,\n      tanggal: shipment.tanggal,\n      nomorResi: shipment.nomorResi,\n      kotaKabupaten: shipment.kotaKabupaten,\n      kecamatan: shipment.kecamatan,\n      barang: updatedBarang,\n    );"""
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('home_screen.dart target not found')
          home.write_text(s, encoding='utf-8')

          export = Path('lib/services/export_service.dart')
          s = export.read_text(encoding='utf-8')
          old = "replaceFirst(RegExp(r'0+\\$'), '').replaceFirst(RegExp(r'\\.\\$'), '')"
          new = "replaceFirst(RegExp(r'0+$'), '').replaceFirst(RegExp(r'\\.$'), '')"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('export_service.dart _fmtNum target not found')
          export.write_text(s, encoding='utf-8')
          PY

          grep -q 'noTelepon: shipment.noTelepon' lib/screens/home_screen.dart
          grep -q 'kotaKabupaten: shipment.kotaKabupaten' lib/screens/home_screen.dart
          grep -q 'kecamatan: shipment.kecamatan' lib/screens/home_screen.dart
          grep -Fq "RegExp(r'0+$')" lib/services/export_service.dart
          grep -Fq "RegExp(r'\\.$')" lib/services/export_service.dart

          if git diff --quiet -- lib/screens/home_screen.dart lib/services/export_service.dart; then
            echo 'Source fixes already present.'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/screens/home_screen.dart lib/services/export_service.dart
            git commit -m "fix: preserve shipment fields and number formatting"
            git push
          fi
