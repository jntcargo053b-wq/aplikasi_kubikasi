name: Patch default item naming

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, 'Enable default Item naming')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch default Item naming
        run: |
          python3 - <<'PY'
          from pathlib import Path

          form = Path('lib/widgets/barang_form_sheet.dart')
          s = form.read_text()
          old = """Future<BarangItem?> showBarangFormSheet(\n  BuildContext context, {\n  BarangItem? existing,\n}) {"""
          new = """Future<BarangItem?> showBarangFormSheet(\n  BuildContext context, {\n  BarangItem? existing,\n  String? initialName,\n}) {"""
          if old not in s:
              raise SystemExit('showBarangFormSheet signature not found')
          s = s.replace(old, new, 1)
          s = s.replace("builder: (_) => _BarangForm(existing: existing),", "builder: (_) => _BarangForm(existing: existing, initialName: initialName),", 1)
          s = s.replace("""class _BarangForm extends StatefulWidget {\n  final BarangItem? existing;\n  const _BarangForm({this.existing});""", """class _BarangForm extends StatefulWidget {\n  final BarangItem? existing;\n  final String? initialName;\n  const _BarangForm({this.existing, this.initialName});""", 1)
          s = s.replace("_nama = TextEditingController(text: e?.nama ?? '');", "_nama = TextEditingController(text: e?.nama ?? widget.initialName ?? '');", 1)
          form.write_text(s)

          parent = Path('lib/screens/pengiriman_form_sheet.dart')
          s = parent.read_text()
          old = "final item = await showBarangFormSheet(context);"
          new = "final item = await showBarangFormSheet(context, initialName: 'Item${_barang.length + 1}');"
          if old not in s:
              raise SystemExit('_addItem call not found')
          s = s.replace(old, new, 1)
          parent.write_text(s)
          PY
          dart format lib/widgets/barang_form_sheet.dart lib/screens/pengiriman_form_sheet.dart
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/barang_form_sheet.dart lib/screens/pengiriman_form_sheet.dart
          git rm .github/workflows/patch_default_item_name.yml
          git commit -m 'Enable default Item naming'
          git push
