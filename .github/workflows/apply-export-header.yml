name: Apply Export Header Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch export header and backup restore
        shell: python
        run: |
          from pathlib import Path
          import re

          export_path = Path('lib/services/export_service.dart')
          text = export_path.read_text(encoding='utf-8')

          header = '''  List<pw.Widget> _headerLines(ReportSettings settings, String defaultTitle, pw.MemoryImage? logo) {
            final company = settings.companyName.trim();
            final address = settings.headerNote.trim();
            final configuredTitle = settings.reportTitle.trim();
            final reportTitle = configuredTitle.isNotEmpty ? configuredTitle : defaultTitle;
            final companyStyle = pw.TextStyle(
              fontSize: company.isNotEmpty ? 16 : 18,
              fontWeight: pw.FontWeight.bold,
            );
            final addressStyle = const pw.TextStyle(
              fontSize: 9,
              color: PdfColor.fromInt(0xFF64748B),
            );
            final reportTitleStyle = const pw.TextStyle(
              fontSize: 9,
              fontWeight: pw.FontWeight.bold,
              color: PdfColor.fromInt(0xFF475569),
            );

            final content = <pw.Widget>[];
            if (company.isNotEmpty) {
              content.add(pw.Text(company, style: companyStyle));
            }
            if (address.isNotEmpty) {
              content.add(pw.SizedBox(height: 2));
              content.add(pw.Text(address, style: addressStyle));
            }
            content.add(pw.SizedBox(height: 2));
            content.add(pw.Text(reportTitle, style: reportTitleStyle));

            if (logo == null) return content;
            return [
              pw.Row(
                crossAxisAlignment: pw.CrossAxisAlignment.center,
                children: [
                  pw.Container(
                    width: 52,
                    height: 52,
                    margin: const pw.EdgeInsets.only(right: 10),
                    child: pw.Image(logo, fit: pw.BoxFit.contain),
                  ),
                  pw.Expanded(
                    child: pw.Column(
                      crossAxisAlignment: pw.CrossAxisAlignment.start,
                      children: content,
                    ),
                  ),
                ],
              ),
            ];
          }

'''
          new_text, count = re.subn(
              r'  List<pw\.Widget> _headerLines\(.*?\n  pw\.Widget _reportFooter',
              header + '  pw.Widget _reportFooter',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Tidak menemukan _headerLines() yang diharapkan.')
          export_path.write_text(new_text, encoding='utf-8')

          export_path = Path('lib/services/export_service.dart')
          text = export_path.read_text(encoding='utf-8')

          combined_old = '''    final company = settings.companyName.trim();
    final note = settings.headerNote.trim();
    if (company.isNotEmpty) {
      setCell(0, row0, company, bold: true);
      row0++;
      setCell(0, row0, 'Rekap Laporan Kubikasi Pengiriman');
      row0++;
    } else {
      setCell(0, row0, 'Rekap Laporan Kubikasi Pengiriman', bold: true);
      row0++;
    }
    if (note.isNotEmpty) {
      setCell(0, row0, note);
      row0++;
    }
'''
          combined_new = '''    final company = settings.companyName.trim();
    final address = settings.headerNote.trim();
    final reportTitle = settings.reportTitle.trim().isNotEmpty
        ? settings.reportTitle.trim()
        : 'Rekap Laporan Kubikasi Pengiriman';
    if (company.isNotEmpty) {
      setCell(0, row0, company, bold: true);
      row0++;
    }
    if (address.isNotEmpty) {
      setCell(0, row0, address);
      row0++;
    }
    setCell(0, row0, reportTitle, bold: true);
    row0++;
'''
          if combined_old not in text:
              raise SystemExit('Blok header Excel gabungan tidak ditemukan.')
          text = text.replace(combined_old, combined_new, 1)

          single_old = '''    final company = settings.companyName.trim();
    final note = settings.headerNote.trim();
    if (company.isNotEmpty) {
      setCell(0, row0, company, bold: true);
      row0++;
      setCell(0, row0, 'Laporan Kubikasi Pengiriman');
      row0++;
    } else {
      setCell(0, row0, 'Laporan Kubikasi Pengiriman', bold: true);
      row0++;
    }
    if (note.isNotEmpty) {
      setCell(0, row0, note);
      row0++;
    }
'''
          single_new = '''    final company = settings.companyName.trim();
    final address = settings.headerNote.trim();
    final reportTitle = settings.reportTitle.trim().isNotEmpty
        ? settings.reportTitle.trim()
        : 'Laporan Kubikasi Pengiriman';
    if (company.isNotEmpty) {
      setCell(0, row0, company, bold: true);
      row0++;
    }
    if (address.isNotEmpty) {
      setCell(0, row0, address);
      row0++;
    }
    setCell(0, row0, reportTitle, bold: true);
    row0++;
'''
          if single_old not in text:
              raise SystemExit('Blok header Excel satu laporan tidak ditemukan.')
          text = text.replace(single_old, single_new, 1)
          export_path.write_text(text, encoding='utf-8')

          backup_path = Path('lib/services/backup_service.dart')
          backup = backup_path.read_text(encoding='utf-8')
          old_settings = '''        companyName: data.settings.companyName,
        headerNote: data.settings.headerNote,
        logoPath: logoPath,
'''
          new_settings = '''        companyName: data.settings.companyName,
        headerNote: data.settings.headerNote,
        logoPath: logoPath,
        reportTitle: data.settings.reportTitle,
'''
          if old_settings not in backup:
              raise SystemExit('Blok restore ReportSettings tidak ditemukan.')
          backup_path.write_text(backup.replace(old_settings, new_settings, 1), encoding='utf-8')

      - name: Verify targeted changes
        run: |
          grep -n "reportTitle" lib/services/export_service.dart lib/services/backup_service.dart
          grep -n "final address" lib/services/export_service.dart

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/export_service.dart lib/services/backup_service.dart .github/workflows/apply-export-header.yml
          git commit -m "feat: align exported report header order" || exit 0
          git rm .github/workflows/apply-export-header.yml
          git commit -m "chore: remove temporary export header workflow"
          git push origin HEAD:main
