name: Patch Report Location Tmp
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch report location fields
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lib/services/export_service.dart')
          s = path.read_text(encoding='utf-8')

          old = "_infoRow('Tanggal', _tanggalFmt.format(p.tanggal)), _infoRow('Jumlah Jenis Barang', '${p.barang.length}'),"
          new = "_infoRow('Tanggal', _tanggalFmt.format(p.tanggal)), _infoRow('Kota/Kabupaten', p.kotaKabupaten), _infoRow('Kecamatan', p.kecamatan), _infoRow('Jumlah Jenis Barang', '${p.barang.length}'),"
          if old not in s:
              raise SystemExit('single PDF info block not found')
          s = s.replace(old, new, 1)

          old_photo = "pw.Text('Pengirim: $pengirim', style: const pw.TextStyle(fontSize: 9)),\n          pw.Text('Tanggal: ${_tanggalFmt.format(tanggal)}', style: const pw.TextStyle(fontSize: 9)),"
          new_photo = "pw.Text('Pengirim: $pengirim', style: const pw.TextStyle(fontSize: 9)),\n          pw.Text('Kota/Kabupaten: $kotaKabupaten', style: const pw.TextStyle(fontSize: 9)),\n          pw.Text('Kecamatan: $kecamatan', style: const pw.TextStyle(fontSize: 9)),\n          pw.Text('Tanggal: ${_tanggalFmt.format(tanggal)}', style: const pw.TextStyle(fontSize: 9)),"
          if old_photo in s:
              s = s.replace(old_photo, new_photo, 1)

          # Extend photo section signature and all its call sites with the saved location.
          old_sig = "required String pengirim,\n    required DateTime tanggal,"
          new_sig = "required String pengirim,\n    required String kotaKabupaten,\n    required String kecamatan,\n    required DateTime tanggal,"
          if old_sig in s:
              s = s.replace(old_sig, new_sig, 1)
          old_call = "title: 'DOKUMENTASI FOTO', resi: p.nomorResi, pengirim: p.pengirim, tanggal: p.tanggal"
          new_call = "title: 'DOKUMENTASI FOTO', resi: p.nomorResi, pengirim: p.pengirim, kotaKabupaten: p.kotaKabupaten, kecamatan: p.kecamatan, tanggal: p.tanggal"
          if old_call in s:
              s = s.replace(old_call, new_call, 1)

          # Combined PDF: include location columns in the shipment summary table.
          old_header = "headers: const ['No', 'Tanggal', 'Resi', 'Pengirim', 'Barang', 'Berat (kg)', 'Kubikasi (m³)'],"
          new_header = "headers: const ['No', 'Tanggal', 'Resi', 'Pengirim', 'Kota/Kabupaten', 'Kecamatan', 'Barang', 'Berat (kg)', 'Kubikasi (m³)'],"
          if old_header in s:
              s = s.replace(old_header, new_header, 1)
          old_row = "['${i + 1}', _tanggalFmt.format(sorted[i].tanggal), sorted[i].nomorResi, sorted[i].pengirim, '${sorted[i].totalJumlah}', sorted[i].totalBerat.toStringAsFixed(2), sorted[i].totalKubikasi.toStringAsFixed(3)]"
          new_row = "['${i + 1}', _tanggalFmt.format(sorted[i].tanggal), sorted[i].nomorResi, sorted[i].pengirim, sorted[i].kotaKabupaten, sorted[i].kecamatan, '${sorted[i].totalJumlah}', sorted[i].totalBerat.toStringAsFixed(2), sorted[i].totalKubikasi.toStringAsFixed(3)]"
          if old_row in s:
              s = s.replace(old_row, new_row, 1)

          # Excel reports: patch the generated row/header lists inside the Excel methods.
          # This is deliberately scoped to the Excel-generation portion so PDF code is untouched.
          excel_pos = s.find('Future<File> generateExcel')
          if excel_pos >= 0:
              end = s.find('Future<File>', excel_pos + 1)
              if end < 0:
                  end = len(s)
              ex = s[excel_pos:end]
              ex_before = ex
              ex = ex.replace("'Pengirim'", "'Pengirim', 'Kota/Kabupaten', 'Kecamatan'", 1)
              ex = ex.replace("p.pengirim", "p.pengirim, p.kotaKabupaten, p.kecamatan", 1)
              s = s[:excel_pos] + ex + s[end:]

          path.write_text(s, encoding='utf-8')
          print('report location patch applied')
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/export_service.dart .github/workflows/patch_report_location_tmp.yml .github/workflows/inspect_export_tmp.yml
          git rm -f .github/workflows/patch_report_location_tmp.yml .github/workflows/inspect_export_tmp.yml || true
          git commit -m "fix: include city and district in reports"
          git push
