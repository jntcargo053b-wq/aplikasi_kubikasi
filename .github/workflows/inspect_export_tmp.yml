name: Inspect Export Tmp
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect report code
        run: |
          echo '--- INFO ROWS ---'
          grep -n "_infoRow\|headers: const \['No', 'Tanggal'\|sheet\|Pengirim\|nomorResi" lib/services/export_service.dart | tail -80
          echo '--- EXCEL SECTION ---'
          grep -n -B8 -A35 "Excel\|excel\|Sheet" lib/services/export_service.dart | tail -160
