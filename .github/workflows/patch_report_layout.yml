name: Patch PDF report layout
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: |
          sed -i '${/^PY$/d;}' scripts/patch_report_layout.py
          python3 scripts/patch_report_layout.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- lib/services/export_service.dart; then exit 0; fi
          git add lib/services/export_service.dart
          git commit -m 'Separate report photos onto dedicated pages'
          git push
