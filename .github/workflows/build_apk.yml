name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # Repo ini belum punya folder android/ (belum pernah dijalankan
      # "flutter create ." secara lokal). Step ini men-generate folder
      # platform secara otomatis di CI kalau belum ada, supaya build
      # tetap jalan walau lupa commit folder android/.
      - name: Scaffold platform folders if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android/ tidak ditemukan, menjalankan flutter create ."
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
