name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # Android platform files are versioned in the repository. Do not run
      # flutter create here: it can regenerate Gradle files and signing config.

      - name: Configure Flutter SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLUTTER_ROOT:-}" || { echo "::error::FLUTTER_ROOT is not available"; exit 1; }
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
          test -f android/local.properties
          grep -q '^flutter.sdk=' android/local.properties


      # The repository does not contain the Gradle wrapper binary. Bootstrap
      # the official wrapper from the pinned Gradle release in CI.
      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android wrapper --gradle-version 8.14 --distribution-type all
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          grep -q 'gradle-8.14-all.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Verify Nextcube identity
        shell: bash
        run: |
          grep -R "com.nextcube.kubikasi" -n android/app/src/main android/app/build.gradle android/settings.gradle
          grep -R "Nextcube" -n android/app/src/main/AndroidManifest.xml
          if grep -R "com.example.volume_calculator" -n android/app/src/main; then exit 1; fi

      - name: Disable Gradle VFS watching
        run: echo 'org.gradle.vfs.watch=false' >> android/gradle.properties

      - name: Verify Gradle version
        run: cd android && ./gradlew --version

      - name: Verify Android Gradle Plugin
        run: grep -R "com.android.application.*8.11.1" -n android/settings.gradle

      - name: Verify Kotlin
        run: grep -R "org.jetbrains.kotlin.android.*2.2.20" -n android/settings.gradle

      - name: Verify NDK
        run: grep -R "ndkVersion" -n android/app/build.gradle

      - name: Configure production signing
        if: ${{ github.event_name == 'workflow_dispatch' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_STORE_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/nextcube-release.jks
          cat > android/key.properties <<EOF
          storeFile=nextcube-release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          chmod 600 android/nextcube-release.jks android/key.properties
          test -s android/nextcube-release.jks
          grep -q '^storeFile=nextcube-release.jks
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Stop Gradle daemons
        if: always()
        run: cd android && ./gradlew --stop || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

 android/key.properties

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Stop Gradle daemons
        if: always()
        run: cd android && ./gradlew --stop || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

