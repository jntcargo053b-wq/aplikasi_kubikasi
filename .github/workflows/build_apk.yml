name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Cek file yang menandakan proyek Gradle Android LENGKAP (bukan
      # cuma folder android/ ada, karena folder bisa saja ada tapi isinya
      # stub/tidak lengkap dan gagal dikenali Gradle). Kalau
      # android/settings.gradle atau android/settings.gradle.kts tidak
      # ada, hapus dan generate ulang dengan "flutter create" resmi
      # supaya seluruh berkas Gradle/Kotlin/wrapper konsisten dengan
      # versi Flutter SDK yang dipakai di step di atas.
      - name: Scaffold platform folders if missing/incomplete
        run: |
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "Struktur android/ tidak lengkap, menghapus dan menjalankan flutter create ulang"
            rm -rf android
            flutter create -t app --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
