name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repository intentionally does not store Gradle wrapper files.
      # Flutter create fills in only missing platform scaffolding/wrapper
      # files and is required here before the Android build.
      - name: Generate missing Flutter/Gradle scaffolding
        run: flutter create --platforms=android --no-pub .

      - name: Upgrade Gradle wrapper to 8.14
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import re
          file_path = 'android/gradle/wrapper/gradle-wrapper.properties'
          with open(file_path, 'r') as f:
              content = f.read()
          content = re.sub(
              r'gradle-\d+\.\d+(?:\.\d+)?-(bin|all)\.zip',
              'gradle-8.14-bin.zip',
              content
          )
          with open(file_path, 'w') as f:
              f.write(content)
          "
          echo "--- Verifying gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties
          grep -q "gradle-8.14-bin.zip" android/gradle/wrapper/gradle-wrapper.properties

      - name: Verify Gradle Version
        working-directory: android
        run: ./gradlew --version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
