name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('lib/screens/home_screen.dart')
          s = home.read_text(encoding='utf-8')
          old = '''    final updatedShipment = Pengiriman(
      id: shipment.id,
      pengirim: shipment.pengirim,
      tanggal: shipment.tanggal,
      nomorResi: shipment.nomorResi,
      barang: updatedBarang,
    );'''
          new = '''    final updatedShipment = Pengiriman(
      id: shipment.id,
      pengirim: shipment.pengirim,
      noTelepon: shipment.noTelepon,
      tanggal: shipment.tanggal,
      nomorResi: shipment.nomorResi,
      kotaKabupaten: shipment.kotaKabupaten,
      kecamatan: shipment.kecamatan,
      barang: updatedBarang,
    );'''
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('home_screen.dart: expected _editBarang constructor not found')
          home.write_text(s, encoding='utf-8')

          export = Path('lib/services/export_service.dart')
          s = export.read_text(encoding='utf-8')
          old = "replaceFirst(RegExp(r'0+\\$'), '').replaceFirst(RegExp(r'\\.\\$'), '')"
          new = "replaceFirst(RegExp(r'0+$'), '').replaceFirst(RegExp(r'\\.$'), '')"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('export_service.dart: expected _fmtNum regex not found')
          export.write_text(s, encoding='utf-8')
          PY

          grep -q 'noTelepon: shipment.noTelepon' lib/screens/home_screen.dart
          grep -q 'kotaKabupaten: shipment.kotaKabupaten' lib/screens/home_screen.dart
          grep -q 'kecamatan: shipment.kecamatan' lib/screens/home_screen.dart
          grep -q "RegExp(r'0+\$')" lib/services/export_service.dart && exit 1 || true
          grep -q "RegExp(r'0+\$')" lib/services/export_service.dart && exit 1 || true

          if git diff --quiet -- lib/screens/home_screen.dart lib/services/export_service.dart; then
            echo 'Source fixes already present.'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/screens/home_screen.dart lib/services/export_service.dart
            git commit -m "fix: preserve shipment fields when editing item"
            git push
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          cache: true

      - name: Generate missing Flutter/Gradle scaffolding
        run: flutter create --platforms=android --no-pub .

      - name: Normalize Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings = Path("android/settings.gradle")
          text = settings.read_text()
          text, count = re.subn(r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])', r'\g<1>8.11.1\2', text, count=1)
          if count == 0: raise SystemExit("com.android.application version not found")
          text, count = re.subn(r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])', r'\g<1>2.2.20\2', text, count=1)
          if count == 0: raise SystemExit("org.jetbrains.kotlin.android version not found")
          settings.write_text(text)
          for path in (Path("android/settings.gradle.kts"), Path("android/build.gradle.kts"), Path("android/app/build.gradle.kts")):
              if path.exists(): path.unlink()
          PY
          grep -q "com.android.application.*8.11.1" android/settings.gradle
          grep -q "org.jetbrains.kotlin.android.*2.2.20" android/settings.gradle
          test ! -e android/settings.gradle.kts
          test ! -e android/build.gradle.kts
          test ! -e android/app/build.gradle.kts

      - name: Pin Gradle wrapper to 8.14
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradle/wrapper/gradle-wrapper.properties
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = p.read_text()
          url = r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip"
          text = re.sub(r"^distributionUrl=.*$", url, text, flags=re.MULTILINE)
          if "distributionUrl=" not in text: text += "\n" + url + "\n"
          p.write_text(text)
          PY
          grep -q "gradle-8.14-bin.zip" android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      - name: Verify Nextcube application identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'namespace "com.nextcube.kubikasi"' android/app/build.gradle
          grep -q 'applicationId "com.nextcube.kubikasi"' android/app/build.gradle
          grep -q 'android:label="Nextcube"' android/app/src/main/AndroidManifest.xml

      - name: Disable Gradle file system watching
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^org.gradle.vfs.watch=' android/gradle.properties 2>/dev/null; then sed -i 's/^org.gradle.vfs.watch=.*/org.gradle.vfs.watch=false/' android/gradle.properties; else printf '\norg.gradle.vfs.watch=false\n' >> android/gradle.properties; fi
          grep -q "org.gradle.vfs.watch=false" android/gradle.properties

      - name: Verify Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Verify Android Gradle Plugin version
        shell: bash
        run: |
          set -euo pipefail
          grep -q "com.android.application.*8.11.1" android/settings.gradle

      - name: Verify Kotlin version
        shell: bash
        run: |
          set -euo pipefail
          grep -q "org.jetbrains.kotlin.android.*2.2.20" android/settings.gradle

      - name: Verify Android NDK version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ndkVersion "28.2.13676358"' android/app/build.gradle

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Stop Gradle daemons
        working-directory: android
        run: ./gradlew --stop || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
