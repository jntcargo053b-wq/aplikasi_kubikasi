name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Flutter/Gradle scaffolding
        run: flutter create --platforms=android --no-pub .

      - name: Normalize Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          text = settings.read_text()

          # Force Android Gradle Plugin 8.11.1
          text, count = re.subn(
              r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>8.11.1\2',
              text,
              count=1,
          )

          if count == 0:
              raise SystemExit(
                  "Could not find com.android.application version "
                  "in android/settings.gradle"
              )

          # Force Kotlin Android Plugin 2.2.20
          text, count = re.subn(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.2.20\2',
              text,
              count=1,
          )

          if count == 0:
              raise SystemExit(
                  "Could not find org.jetbrains.kotlin.android version "
                  "in android/settings.gradle"
              )

          settings.write_text(text)

          # Remove duplicate Kotlin DSL files if they exist.
          for path in (
              Path("android/settings.gradle.kts"),
              Path("android/build.gradle.kts"),
              Path("android/app/build.gradle.kts"),
          ):
              if path.exists():
                  path.unlink()
                  print(f"Removed duplicate: {path}")
          PY

          echo "=== Android plugin configuration ==="
          grep -n "com.android.application" android/settings.gradle
          grep -n "org.jetbrains.kotlin.android" android/settings.gradle

          test ! -e android/settings.gradle.kts
          test ! -e android/build.gradle.kts
          test ! -e android/app/build.gradle.kts

          grep -q "com.android.application.*8.11.1" \
            android/settings.gradle

          grep -q "org.jetbrains.kotlin.android.*2.2.20" \
            android/settings.gradle

      - name: Pin Gradle wrapper to 8.14
        shell: bash
        run: |
          set -euo pipefail

          test -f android/gradle/wrapper/gradle-wrapper.properties

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/gradle/wrapper/"
              "gradle-wrapper.properties"
          )

          text = p.read_text()

          url = (
              r"distributionUrl=https\://services.gradle.org/"
              r"distributions/gradle-8.14-bin.zip"
          )

          text = re.sub(
              r"^distributionUrl=.*$",
              url,
              text,
              flags=re.MULTILINE,
          )

          if "distributionUrl=" not in text:
              text += "\n" + url + "\n"

          p.write_text(text)
          PY

          echo "=== Gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

          grep -q "gradle-8.14-bin.zip" \
            android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

      - name: Verify Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Verify Android Gradle Plugin version
        shell: bash
        run: |
          set -euo pipefail

          grep -n "com.android.application" \
            android/settings.gradle

          grep -q "com.android.application.*8.11.1" \
            android/settings.gradle

      - name: Verify Kotlin version
        shell: bash
        run: |
          set -euo pipefail

          grep -n "org.jetbrains.kotlin.android" \
            android/settings.gradle

          grep -q "org.jetbrains.kotlin.android.*2.2.20" \
            android/settings.gradle

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
