name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Ensure Android platform files
        run: flutter create --platforms=android --no-pub .

      - name: Normalize Android Gradle configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/settings.gradle')
          s = p.read_text()
          s = s.replace("com.android.application' version '8.11.1' apply false", "com.android.application' version '8.11.1' apply false")
          s = s.replace("org.jetbrains.kotlin.android' version '2.2.20' apply false", "org.jetbrains.kotlin.android' version '2.2.20' apply false")
          p.write_text(s)
          PY

      - name: Pin Gradle 8.14
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          import re
          s = re.sub(r'distributionUrl=.*', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip', s)
          p.write_text(s)
          PY

      - name: Verify Nextcube identity
        shell: bash
        run: |
          grep -R "com.nextcube.kubikasi" -n android/app/src/main android/app/build.gradle android/settings.gradle
          grep -R "Nextcube" -n android/app/src/main/AndroidManifest.xml
          if grep -R "com.example.volume_calculator" -n android/app/src/main; then exit 1; fi

      - name: Disable Gradle VFS watching
        run: echo 'org.gradle.vfs.watch=false' >> android/gradle.properties

      - name: Verify Gradle version
        run: cd android && ./gradlew --version

      - name: Verify Android Gradle Plugin
        run: grep -R "com.android.application.*8.11.1" -n android/settings.gradle

      - name: Verify Kotlin
        run: grep -R "org.jetbrains.kotlin.android.*2.2.20" -n android/settings.gradle

      - name: Verify NDK
        run: grep -R "ndkVersion" -n android/app/build.gradle

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Stop Gradle daemons
        if: always()
        run: cd android && ./gradlew --stop || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
