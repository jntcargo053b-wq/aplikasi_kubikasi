name: Fix export compile

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch export_service.dart
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/services/export_service.dart')
          text = path.read_text(encoding='utf-8')

          text = text.replace("import 'package:flutter/foundation.dart';\n", '')
          text = text.replace("import '../models/barang_item.dart';\n", '')

          marker = "  String _sanitize(String value) {\n"
          helper = "  String _fmtNum(double value) {\n    if (value == value.roundToDouble()) return value.toInt().toString();\n    return value.toStringAsFixed(2).replaceFirst(RegExp(r'0+\$'), '').replaceFirst(RegExp(r'\\.\$'), '');\n  }\n\n"
          if 'String _fmtNum(double value)' not in text:
              text = text.replace(marker, helper + marker, 1)

          old = """    for (final item in p.barang) {\n      for (final path in item.fotoPaths) {\n        if (result.length >= limit) {\n          return _LoadedPhotos(photos: result, truncated: true);\n        }\n        final file = File(path);\n        if (!await file.exists()) continue;\n        try {\n          final bytes = await file.readAsBytes();\n          if (bytes.isEmpty) continue;\n          final decoded = img.decodeImage(bytes);\n          if (decoded == null) continue;\n          final processed = _prepareReportImage(decoded);\n          result.add(_PhotoData(image: pw.MemoryImage(img.encodeJpg(processed, quality: _reportPhotoJpegQuality)), itemName: item.nama));\n        } catch (_) {\n          // Abaikan foto yang rusak agar export laporan tetap berjalan.\n        }\n      }\n    }\n    var totalAvailable = 0;\n    for (final item in p.barang) {\n      totalAvailable += item.fotoPaths.length;\n    }\n"""
          new = """    for (final item in p.barang) {\n      final path = item.photoPath;\n      if (path == null || path.isEmpty) continue;\n      if (result.length >= limit) {\n        return _LoadedPhotos(photos: result, truncated: true);\n      }\n      final file = File(path);\n      if (!await file.exists()) continue;\n      try {\n        final bytes = await file.readAsBytes();\n        if (bytes.isEmpty) continue;\n        final decoded = img.decodeImage(bytes);\n        if (decoded == null) continue;\n        final processed = _prepareReportImage(decoded);\n        result.add(_PhotoData(image: pw.MemoryImage(img.encodeJpg(processed, quality: _reportPhotoJpegQuality)), itemName: item.nama));\n      } catch (_) {\n        // Abaikan foto yang rusak agar export laporan tetap berjalan.\n      }\n    }\n    var totalAvailable = 0;\n    for (final item in p.barang) {\n      if (item.photoPath != null && item.photoPath!.isNotEmpty) totalAvailable++;\n    }\n"""
          if old not in text:
              raise SystemExit('Expected _loadPhotos block not found')
          text = text.replace(old, new, 1)

          old = """      for (final barang in item.barang) {\n        count += barang.fotoPaths.length;\n      }\n"""
          new = """      for (final barang in item.barang) {\n        if (barang.photoPath != null && barang.photoPath!.isNotEmpty) count++;\n      }\n"""
          if old not in text:
              raise SystemExit('Expected quota block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/export_service.dart
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix export service model compatibility"
          git push
