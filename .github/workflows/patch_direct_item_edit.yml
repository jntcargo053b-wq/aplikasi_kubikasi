name: One-time patch - direct item edit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Enable direct item editing') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch direct item editing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/home_screen.dart')
          text = path.read_text()

          marker = "  Future<void> _removeItem(int index) async {"
          method = r'''  Future<void> _editBarang(Pengiriman shipment, int index) async {
    if (index < 0 || index >= shipment.barang.length) return;

    final before = shipment.barang[index];
    final oldPhoto = before.photoPath;
    final result = await showBarangFormSheet(context, existing: before);
    if (result == null || !mounted) return;

    final i = _items.indexWhere((e) => e.id == shipment.id);
    if (i == -1) return;

    final previous = List<Pengiriman>.of(_items);
    final updatedBarang = List<BarangItem>.of(shipment.barang);
    updatedBarang[index] = result;
    final updatedShipment = Pengiriman(
      id: shipment.id,
      pengirim: shipment.pengirim,
      tanggal: shipment.tanggal,
      nomorResi: shipment.nomorResi,
      barang: updatedBarang,
    );
    final next = List<Pengiriman>.of(_items);
    next[i] = updatedShipment;

    final saved = await _persistItems(next);
    if (saved && mounted) {
      setState(() => _items = next);
      await _cleanupAfterSuccessfulSave(previous, next);
    } else {
      final oldPaths = _photoPaths(previous);
      final newPath = result.photoPath;
      if (newPath != null && newPath.isNotEmpty && !oldPaths.contains(newPath)) {
        await PhotoStorageService.delete(newPath);
      }
    }

    // oldPhoto is intentionally not deleted directly here. The shared
    // transactional cleanup removes it only when it is no longer referenced.
    // This keeps photos safe when the same path is referenced elsewhere.
    assert(oldPhoto == before.photoPath);
  }

'''

          if 'Future<void> _editBarang(Pengiriman shipment, int index)' not in text:
              if marker not in text:
                  raise SystemExit('Could not find _removeItem insertion marker')
              text = text.replace(marker, method + marker, 1)

          old = """                title: Text(b.nama, maxLines: 1, overflow: TextOverflow.ellipsis),"""
          new = """                title: InkWell(
                  onTap: () => _editBarang(p, p.barang.indexOf(b)),
                  child: Text(
                    b.nama,
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                    style: const TextStyle(fontWeight: FontWeight.w700),
                  ),
                ),"""
          if old not in text:
              raise SystemExit('Could not find barang title to patch')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          dart format lib/screens/home_screen.dart
          grep -n "_editBarang\|InkWell" lib/screens/home_screen.dart

      - name: Commit source change and remove one-time patch workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart .github/workflows/patch_direct_item_edit.yml
          git rm .github/workflows/patch_direct_item_edit.yml
          git commit -m "Enable direct item editing"
          git push
